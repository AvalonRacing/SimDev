[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simdev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "trimesh>=4.0",
    # trimesh defers these: process=True and fix_normals() need scipy and
    # networkx for the face-adjacency graph. Without them trimesh imports
    # cleanly and raises only when the geometry is actually built.
    "scipy>=1.11",
    "networkx>=3.0",
    "shapely>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
simdev = "simdev.cli:main"

[tool.setuptools]
package-dir = {"" = "pipeline"}

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.setuptools.package-data]
simdev = ["render/templates/*.jinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "openfoam: requires a working OpenFOAM installation",
]
