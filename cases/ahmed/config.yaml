# Ahmed body validation case.
#
# Reference: Ahmed, Ramm & Faltin, SAE 840300 (1984).
# 35 degree slant, chosen over 25 degrees because the 25 degree case sits on
# the separation/reattachment bifurcation where steady RANS fails for
# turbulence-model reasons, not pipeline reasons.
#
# Fixed floor, matching the reference experiment's stationary tunnel wall.
# This is why ground motion is a per-case field, not role behaviour.
#
# acceptance.target_cd is confirmed against the primary source in Task 18.
name: ahmed

flow:
  u_inf: 40.0
  nu: 1.5e-05
  rho: 1.225
  turbulence_intensity: 0.005
  turbulence_length_scale: 0.01

ground:
  motion: static

physics:
  turbulence_model: kOmegaSST
  wall_treatment: high_y_plus
  mode: straight
  yaw_deg: 0.0

domain:
  kind: box
  upstream_lengths: 5.0
  downstream_lengths: 10.0
  half_width_lengths: 3.0
  height_lengths: 3.0
  max_blockage: 0.01

  # At 35 degrees the drag is the slant separation and the counter-rotating
  # C-pillar vortices, and both live in the volume rather than against the
  # wall. Surface refinement alone leaves them at the background cell size,
  # which is how a grid study converges smoothly onto the wrong Cd.
  #
  # Levels are relative to base_cell_size, so these follow the resolution
  # profile rather than fighting it. Offsets are body lengths off the
  # geometry bounding box.
  refinement_regions:
    # Broad envelope: the whole body plus three body lengths of wake.
    - name: wake
      level: 2
      x_start: -0.2
      x_end: 3.0
      half_width: 0.5
      height: 0.6
    # The slant itself and the near-wake recirculation, where the separation
    # is decided. Starts upstream of the slant break at x ~ 0.82.
    - name: nearWake
      level: 3
      x_start: 0.6
      x_end: 1.0
      half_width: 0.3
      height: 0.45

forces:
  a_ref_full: 0.112032   # width 0.389 x height 0.288, stilts excluded
  l_ref: 1.044
  c_of_r: [0.522, 0.0, 0.0]

geometry:
  kind: ahmed
  ahmed:
    length: 1.044
    width: 0.389
    height: 0.288
    slant_angle_deg: 35.0
    slant_length: 0.222
    nose_radius: 0.100
    ground_clearance: 0.050
    stilt_diameter: 0.030
    include_stilts: true
  patches:
    - {name: body, role: body}
    # The stilts are 30 mm cylinders against a 1044 mm body. At the case-wide
    # level they land two cells across, snappy cannot build a medial axis it
    # trusts, and the layer stack collapses to a quarter of what was asked
    # for. Two extra levels put ~8 cells across the diameter; the layer
    # budget shrinks with the cell, so fewer layers are requested there and
    # snappy actually delivers them.
    - {name: stilts, role: body, refinement_min: 4, refinement_max: 5}
    # No prism layers on the floor, deliberately, and against instinct.
    #
    # The floor is a no-slip wall carrying a wall function, so it "should"
    # have layers - without them its first cell centre sits 60 mm off the
    # ground and the measured y+ is about 2000, far outside the 30-300 the
    # wall function assumes. But snappy solves layer displacement for all
    # layered surfaces together, and in the 50 mm ground clearance that
    # coupling costs the body more than the floor gains. Measured on the dev
    # profile:
    #
    #     ground layers   body coverage   ground coverage
    #     off             4.22 / 5 (85%)  -
    #     2               3.47 / 5 (69%)  0.63 / 2 (32%)
    #     5               3.47 / 5 (69%)  2.71 / 5 (54%)
    #
    # Layering the floor degrades the surface the forces are integrated on
    # and still fails to resolve the floor. Forces come from the body, so the
    # body wins. The y+ gate records the floor's number as a warning rather
    # than hiding it, so this stays a measured decision instead of an
    # accident - see docs/validation-ahmed.md.
    #
    # This is specific to a stationary floor with a tight clearance. A moving
    # ground has a far thinner boundary layer, and the RC car may well want
    # layers here; the capability is in place, only this case declines it.
    - {name: ground, role: ground, n_layers: 0}
    - {name: symmetry, role: symmetry}
    - {name: inlet, role: inlet}
    - {name: outlet, role: outlet}
    - {name: farfield, role: farfield}
