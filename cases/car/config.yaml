# AvalonRacing RC car.
#
#   simdev run cases/car/config.yaml --run-dir ~/runs/car-01 --profile car_dev
#
# ---------------------------------------------------------------------------
# SWITCHING DRIVING STATE
#
# Change the one line `driving_state:` below. Everything that moves together
# when the car is doing something different - which geometry folder to read,
# how fast it is going, whether it is cornering and how tightly - lives in the
# matching entry under `driving_states:` further down.
#
# To add a state: export a complete folder under CAD/ using the same 15 part
# names as CAD/Testcase, then add an entry here. Nothing else changes: the
# wheel axes, centres, rolling radii and ride height are all measured from the
# geometry of whichever state is selected.
#
# The selected state is merged over this file during config resolution, so
# caseSpec.json still contains one fully explicit specification and records
# which state produced it.
# ---------------------------------------------------------------------------

name: car

driving_state: testcase

driving_states:

  # 4 m radius at 15 m/s: omega = 3.75 rad/s, about 5.7 g lateral.
  #
  # The attitude for this state - body slip, steer, camber, ride height - is
  # already in the CAD and is used exactly as exported.
  testcase:
    geometry:
      source_dir: CAD/Testcase
    flow:
      u_inf: 15.0
    physics:
      mode: cornering
      corner_radius: 4.0
      corner_direction: left
    domain:
      kind: annulus
    ground:
      # In a rotating frame the road is stationary in the ground frame and its
      # sweep under the car comes out of the frame transform. Setting 'moving'
      # here would be ignored, and the validator says so.
      motion: static

  # A straight-line baseline for the same car. Add the folder when you have
  # one; until then this state points at the same geometry and simply does not
  # corner, which is still useful for a drag reference.
  straight:
    geometry:
      source_dir: CAD/Testcase
    flow:
      u_inf: 15.0
    physics:
      mode: straight
    domain:
      kind: box
    ground:
      motion: moving

flow:
  nu: 1.5e-05
  rho: 1.225
  turbulence_intensity: 0.01
  turbulence_length_scale: 0.02

  # The CAD assembly is built nose-forward along +x, so the car travels along
  # +x and the air comes at it from +x. The tunnel is reversed rather than the
  # car, because the geometry is never transformed.
  #
  # This one setting drives every other direction: which end of the domain is
  # the inlet, the drag and side axes in forceCoeffs, which side of the car is
  # its left, the sign of the cornering frame, and the direction the road runs
  # under the tyres. Reversing the tunnel and forgetting the drag axis is how
  # a case converges to a confidently negative Cd.
  direction: "-x"

physics:
  turbulence_model: kOmegaSST
  # At 1/10 scale the appendages sit at Re_chord ~ 4e4, where the first cell
  # of a high-y+ mesh swallows most of the boundary layer. Handbook 3.6.
  wall_treatment: low_y_plus
  yaw_deg: 0.0
  wheel_rotation: spinning

# The prism stack, owned by the case rather than the wall profile.
#
# It has to live here. resolve() merges WALL_PROFILES *after*
# RESOLUTION_PROFILES, so these four values in the `car` profile would be
# silently overwritten by the generic low_y_plus numbers. The case is the last
# layer before overrides, and it is also the right owner on the merits: the
# first layer follows from *this car's* Reynolds number, and the generic
# low_y_plus stack is sized for nothing in particular.
#
# The numbers come from u_tau = 0.70 m/s at 15 m/s over a 0.44 m car
# (Cf = 0.058 Re^-0.2, Re = 4.4e5), against the 0.75 mm surface cell that
# base_cell_size 96 mm at level 7 produces. (It was 24 mm at level 5 when
# these numbers were derived; the x4 re-basing left the 0.75 mm untouched,
# which is the whole point of having done it by a power of two.)
#
# WHAT WAS WRONG WITH THE GENERIC STACK. 18 layers of 20 um at ER 1.15 want
# 1.52 mm and the budget is a fraction of a 0.75 mm cell, so 9 got inserted
# and the case carried eleven truncation warnings. Worse than the warnings:
# the ninth layer was 61 um and the hex above it 414 um, a 6.8x jump in the
# one place the mesh is meant to be graded. Two thirds of the whole mesh was
# prism cells buying that.
#
# WHY THESE NUMBERS. Widening ER to 1.25 lets six layers span what nine
# spanned and land far closer to the cell they hand off to: last layer 122 um
# into 300 um of remaining cell, a 2.5x jump. Doubling the first layer to
# 40 um moves y+ from 0.46 to 0.93 - still wall-resolved with 5x of margin on
# the 0-5 gate, and it stops spending resolution below y+ 1 where there is
# nothing left to resolve. The stack now reaches y+ 21, so it covers the
# viscous sublayer and the buffer layer and hands off to the hexes in the log
# layer, which is the point of a low-Re mesh. It is also ~2.9 M cells cheaper.
#
# n_layers is 6 rather than a larger request that gets clamped, so the stack
# is identical on car_smoke, car_dev and car. A request that resolves to a
# different count per profile changes the near-wall physics when you change
# resolution, which is exactly what scripts/mesh_independence.py pins
# n_layers to avoid.
#
# ER 1.25 is the practical ceiling. Past ~1.3 the truncation error across the
# stack starts to matter, and it buys little: the span from 40 um to a 750 um
# cell is fixed, and only the cell size can close it further.
mesh:
  # WHY THIS CASE OWNS A LOWER FLOOR THAN THE 0.7 DEFAULT.
  #
  # 0.7 is sized for a body like the Ahmed: one large, smooth, well-resolved
  # surface where a prism stack goes in cleanly. This car is 24% suspension
  # and tyre by wetted area, and a 4-6 mm suspension link is 6-8 cells across
  # at 0.75 mm. snappy cannot build a medial axis it trusts on a feature that
  # thin, and the stack collapses to ~1.5 of 6 layers there whatever it is
  # asked for.
  #
  # IT IS NOT REACHABLE BY REFINING, WHICH IS THE POINT. Refining the tyres
  # one level (6 -> 7) moved them 1.46 -> 3.1 layers, the single largest
  # response any knob produced. The same jump on the suspension lands near
  # 3.1 of 6, i.e. 52% - still under 0.7, for four times the cells. A
  # threshold no affordable mesh can meet does not gate anything, it just
  # stops every run.
  #
  # WHAT ACTUALLY GUARDS THE NEAR-WALL PHYSICS IS THE Y+ GATE, and it is not
  # relaxed: post.yplus_max stays at 5 and every force-bearing patch is
  # measured against it. On the mesh this number was set for, all eleven come
  # in at 1.96-4.90, wall-resolved throughout. Coverage is still recorded per
  # patch in status/mesh.json either way, so the shortfall stays visible.
  #
  # 0.2 rather than off: it still fires if snappy extrudes essentially
  # nothing, which is a real failure mode and the one worth catching.
  min_layer_coverage: 0.2
  n_layers: 6
  # 40 -> 25 um, 2026-08-22, TO BUY STACK HEADROOM RATHER THAN TO CHASE y+
  # DIRECTLY. The note above explains why 40 um was chosen over the 20 um
  # wall-profile default: it moved y+ from 0.46 to 0.93 and stopped spending
  # resolution below y+ 1. That reasoning still holds, and this does not undo
  # it - 25 um puts Body back at ~0.93 x 25/40 = 0.93, Wing ~0.84, which is
  # still at the y+ ~1 the argument asks for and nowhere near the 0.46 it
  # rejected.
  #
  # What it buys is margin. The measured failure on the 13.28M run was not
  # that 40 um is too thick where it is honoured - Body and Wing came in at
  # 1.49 and 1.35, comfortably inside the 0-5 band. It is that on the tyres
  # and the suspension snappy could not fit the stack at all and thickened
  # the first layer to compensate, which is what put four tyres at 4.6-5.1
  # and failed the gate on Tire_FL. Six layers at 40 um want 450 um of a
  # 487.5 um budget - 92% - and a curved tread near a contact patch does not
  # leave 8% of slack anywhere.
  #
  # At 25 um the same six layers want 281 um, 58% of that budget, and 205 um
  # (five layers, the clamp) against the 243.75 um the tyres now have after
  # their refinement to 0.375 mm. Both leave real room. The stack still
  # reaches into the log layer: 281 um is y+ ~13 at the body condition
  # against ~21 before, which is the one thing this costs.
  #
  # y+ is roughly linear in this number wherever the stack is honoured, so
  # expect Body ~0.93, Wing ~0.84, Chassis ~0.50, tyres ~2-3. If a later run
  # shows the good patches drifting under y+ 0.5 with no tyre benefit, this
  # is the number to put back up - not the gate bound.
  first_layer_thickness: 2.5e-05
  expansion_ratio: 1.25
  # Raised from the 0.5 default, which is also snappy's own
  # maxFaceThicknessRatio - the schema renders this straight into it so the
  # two can never disagree. 0.5 caps the stack at 375 um and rejects the sixth
  # layer by 75 um; 0.65 admits six (450 um) and still refuses seven (603 um),
  # so the limit continues to bite rather than being switched off.
  max_layer_cell_ratio: 0.65

domain:
  upstream_lengths: 5.0
  downstream_lengths: 10.0
  half_width_lengths: 3.0
  height_lengths: 3.0
  max_blockage: 0.01

  # Deliberately none for the cornering state. A refinement region is an
  # axis-aligned box and a cornering wake follows the curve of the path, so a
  # box sized to hold the wake would leave most of its cells in clean air.
  # See domain.wake below for the curved region that replaces it.
  refinement_regions: []

  # Refinement measured from the vehicle's own surface instead, which is what
  # a box cannot do here: it needs no orientation, so it is equally right for
  # the cornering state, the straight state and the body-slip attitude the CAD
  # is posed at.
  #
  # WHY THIS EXISTS. Before it, the first production mesh went from 96 mm
  # background straight to 0.75 mm on the wall with almost nothing in between:
  # levels 1 and 2 held 3,881 and 18,731 cells out of 7.4 M. Surface
  # refinement only thickens the mesh next to the wall, so a cell or two off
  # the bodywork the flow was being resolved at background size - including
  # the flow *through* the car, between body, chassis and wishbones, which is
  # where a fair part of the drag is made.
  #
  # Distances are body lengths (0.44 m), so 0.12 is 53 mm - about a tyre
  # radius, and comfortably more than the ride height, which is why the road
  # under the car is refined with it. Levels are absolute: 4 is 3 mm against
  # the 0.75 mm on the wall itself (48 mm background, see profiles.py "car").
  #
  # They must get coarser with distance. snappy applies the first shell that
  # contains a cell, so an outer shell finer than an inner one silently never
  # applies; validate() rejects that rather than letting it mesh.
  #
  # NOT A WAKE REGION. These follow the car, not the path, so past 0.9 body
  # lengths the cornering far wake would be at background size without
  # domain.wake below to hand off to.
  #
  # Mid-field tier added 2026-08-21: level 1 (24 mm, half the 48 mm
  # background) from 0.90 out to 1.30 body lengths, pushing toward 15M cells
  # and giving the near-wake formation region one coarsening step instead of
  # dropping straight to raw background at 0.9 - which the CFD review flagged
  # as a plausible contributor to the force oscillation on top of the
  # physical limit-cycle. Not a wake region either, same limitation as the
  # three shells above: it follows the car, not the path.
  #
  # REACH RESTORED TO 1.80 (2026-08-21, second pass). It had been pulled in to
  # 1.30 on the theory that it shared the blame for a 20.35M count against a
  # 15M target. Measured, both ways, on the full mesh:
  #
  #   reach 1.80 -> 20.35M cells
  #   reach 1.30 -> 20.26M cells      (a 0.4% saving)
  #
  # and in the finished mesh the level 1 tier holds 49,154 cells, 0.24% of the
  # total. The tier is nearly free at any reach, so it is set by what the wake
  # needs rather than by a cell budget, and 1.80 is the reach that actually
  # hands off to domain.wake. The overshoot was never here - it was entirely
  # the Body promotion below, which is where the 15M target got paid for.
  refinement_shells:
    - {distance: 0.12, level: 4}
    - {distance: 0.35, level: 3}
    - {distance: 0.90, level: 2}
    - {distance: 1.80, level: 1}

  # The curved wake region NOT A WAKE REGION above warns about. Swept along
  # the same arc the annulus domain itself is built from - domain.point() at
  # the vehicle's own corner_radius - so it curves with whichever
  # corner_radius/corner_direction the driving state asks for and needs no
  # orientation of its own, the same reasoning as refinement_shells. No-op on
  # the straight state, which resolves to a box domain with no arc to sweep
  # along.
  #
  # start 0.0 picks up right where the vehicle shells leave off (they cover
  # the car out to 0.90 body lengths); end 5.0 carries it to about half the
  # downstream domain length.
  #
  # half_width 0.35 and half_height 0.25 body lengths are a first-pass
  # estimate sized to comfortably cover the car's own track width and height
  # with margin for the wake to spread - nobody has measured the actual wake
  # width off this mesh yet. Check it against a real run (U in a few
  # cross-sections behind the car) before trusting a force number that
  # depends on it, and widen it if the wake is spilling out of the fine band.
  # SHELLS WIDENED 2026-08-21 to spend the cells the Body cap freed, and the
  # first tier is sized to a property of the tube rather than picked.
  #
  # _write_wake_surface sweeps an OPEN rectangular tube - four side walls, no
  # caps, no interior - and these are `mode distance` from that surface. So a
  # tier does not fill the tube, it wraps its walls in a rind. The deepest
  # interior point is min(half_width, half_height) = 0.25 body lengths from
  # the nearest wall, which means the old first tier at 0.15 left the middle
  # of the wake at level 2 (12 mm) inside a level 3 (6 mm) rind - the finest
  # cells on the band's edge and the coarsest in its core, which is backwards.
  # Any first tier < 0.25 has that defect; 0.50 clears it with margin.
  #
  # Measured cost, sampling the wake neighbourhood and summing 1/cell^3
  # (deltas against the mesh this replaces, at 10.80M):
  #
  #   0.15/0.40/0.55 (was)          -            10.80M
  #   0.25/0.40/0.55        +0.82M  ->           11.62M   core just covered
  #   0.40/0.70/1.00        +2.62M  ->           13.42M
  #   0.50/0.80/1.10        +3.92M  ->           14.72M   <- chosen
  #   0.60/0.90/1.20        +5.33M  ->           16.13M   over budget
  #
  # NOT SPENT ON A LEVEL 4 TIER, though it fits: 0.05 at level 4 costs +4.20M
  # and lands on 15.0M almost exactly. It would put the finest cells in the
  # case in a 22 mm rind hugging the tube wall - and half_width/half_height
  # are an unmeasured first-pass estimate, so that wall is not a physical
  # surface. Refining the wake uniformly is worth more than resolving an
  # arbitrary boundary finely. Revisit once the wake has been measured off a
  # real run and the tube is known to sit where the shear layers are.
  wake:
    start: 0.0
    end: 5.0
    half_width: 0.35
    half_height: 0.25
    # THE LEVEL 4 TIER WAS ADDED AND THEN TAKEN BACK OUT, 2026-08-22, AND THE
    # ORIGINAL OBJECTION ABOVE IS WHY IT LOST THE TIE.
    #
    # It went in for a 20M target and is measured at +4.20M. Body going to
    # 0.375 mm is measured at +9.46M. From a 13.28M base the two together are
    # ~27M, so at a 20M budget they do not both fit and one has to go.
    #
    # Body wins on two counts. It is the surface actually under development,
    # where this tier refines flow around a tube whose half_width and
    # half_height are still the unmeasured first-pass estimate the note above
    # warns about - so the tier's cells land in a rind around a boundary that
    # may not be where the shear layers are, while Body's land on geometry
    # that is definitely there. And the wake region sits 0 to 5 body lengths
    # DOWNSTREAM: it shapes base pressure near the car, but most of its length
    # is behind everything that carries load.
    #
    # The three tiers below stay. They are what the 13.28M run had, they hand
    # off to the mid-field shell cleanly, and nothing measured says they are
    # short. WHAT WOULD JUSTIFY THE LEVEL 4 TIER IS THE MEASUREMENT NOBODY HAS
    # TAKEN YET: sample U in cross-sections at 0.5, 1, 2 and 3 body lengths
    # behind the car, see where the velocity deficit actually sits against
    # this tube, and size half_width/half_height to it. Refining around a
    # guessed boundary is what this keeps declining to do.
    shells:
      - {distance: 0.50, level: 3}
      - {distance: 0.80, level: 2}
      - {distance: 1.10, level: 1}

  # Meshing time, at no cost in resolution anywhere.
  #
  # The shells above are answered from an octree over the *combined* vehicle
  # surface, which snappy rebuilds on every rank each time it redistributes
  # the mesh mid-refinement. That surface is the CAD tessellation as exported:
  # 598,654 triangles, sized by geometry.tessellation for surfaces that get
  # snapped to. Nothing here is snapped to. It is measured from, and a
  # distance only has to be right to a fraction of the cell it is deciding.
  #
  # 2 mm takes it to 146,598 triangles - a quarter - and the measured cost is
  # nothing: Body 99.9% of its area retained, Wing 99.1%, tyres 99.8%,
  # suspension 97.9%. The suspension is the number that matters, because 4 mm
  # links are the thin features that a simplification can silently delete, and
  # they are still there.
  #
  # WHY NOT COARSER. 3 mm keeps 93.6% of the suspension and 5 mm only 81.5%,
  # which is links disappearing from the distance field altogether - and a
  # link snappy cannot measure to pulls no refinement around itself, which is
  # the flow *between* body, chassis and wishbones that the innermost shell
  # was added for. prepare measures this per part on every run and warns below
  # 95%, so a tolerance raised too far says so rather than quietly coarsening
  # the mesh between the parts.
  #
  # It also bounds how far the refinement boundary can move: 2 mm against an
  # innermost shell of 53 mm.
  shell_surface_tolerance: 0.002

forces:
  # Declared, not measured. The pipeline no longer computes a projected area
  # from the triangles, so this is the only reference area in play - it
  # non-dimensionalises every coefficient AND is what the blockage check is
  # measured against.
  a_ref_full: 0.02
  l_ref: 0.44
  c_of_r: [0.0, 0.0, 0.0]

geometry:
  kind: step
  # The only thing applied on import: millimetres to metres. The pipeline
  # does not rotate, translate or snap the geometry. Yaw, pitch, roll,
  # steering, camber and ride height are all set in CAD and arrive baked into
  # the part positions, and the tyres are expected to cross z = 0 because the
  # part below the road is the contact patch.
  scale: 0.001

  # Surface mesh sizing for the STEP import, in metres. curvature_segments is
  # elements per full circle and is what decides whether a 6 mm suspension
  # link is a hexagon or a cylinder.
  tessellation:
    max_edge: 0.004
    min_edge: 0.0004
    curvature_segments: 24

  # Where the tyres meet the road. The tyre is cut on a horizontal plane this
  # far above z = 0 and the cross-section is extruded straight down through
  # it, so the tangential tread/road wedge becomes a vertical wall at ninety
  # degrees. Handbook, "The tyre contact patch".
  #
  # WHY 1 mm AND NOT LESS. cut_height is the height of the step, so it has to
  # be something snappy can resolve. The tyres run at refinement_max 5 on a
  # 24 mm base cell, which is a 0.75 mm surface cell: at the 0.5 mm this
  # started at, the step was two thirds of one cell and snappy would have
  # smeared it back into the ramp the cut exists to remove. 1 mm gives it
  # 1.3 cells to work with, and prepare stops warning.
  #
  # WHAT IT COSTS. The footprint is the chord of the tread at the cut plane,
  # so raising the plane widens it: these tyres sit 0.7-1.4 mm into the road,
  # and going from 0.5 mm to 1 mm takes the cut depth from 1.2-1.9 mm to
  # 1.7-2.4 mm and the footprint about 19% longer than the drawn deflection
  # implies. That is the trade being made - a slightly over-large contact
  # patch that meshes, against an exact one that does not. Lowering it again
  # only pays once the tyres are refined past level 5.
  contact_patch:
    cut_height: 0.001
    depth_below_road: 0.002

  # The MRF sleeves are drawn to the same nominal diameter as the tyre bore,
  # so in the CAD the two surfaces are the same surface: measured gaps of
  # 3-7 um over about three quarters of each sleeve.
  #
  # That is degenerate for snappyHexMesh. A faceZone lying on a wall gave all
  # four zones "multiply connected (shared edge)", 381 non-manifold points,
  # 12,062 baffles, max non-orthogonality above the gate, and an intermittent
  # reversed face at the top of the front-right tyre. Deleting the sleeves
  # made all of it go away, which is how it was pinned down - but they are not
  # optional, so they are pushed into the tyre instead.
  #
  # WHY 3 mm. It has to be worth a couple of cells or snappy can still resolve
  # the two surfaces as one, and the sleeves sit at level 6 - a 1.5 mm cell -
  # so two cells is 3 mm. validate() checks exactly this and warned at the
  # 2 mm default. It takes the sleeve from r = 27 mm to r = 30 mm, still 3 mm
  # clear of the 33 mm tread, and prepare warns if it ever reaches it.
  mrf_interference:
    interference: 0.003

  # Not symmetric about y = 0, and posed at an attitude besides. Keeps the
  # model full and a_ref at its full value. Handbook 3.3.
  symmetric: false

  patches:
    # --- bodywork ------------------------------------------------------
    # BODY IS HELD AT 6, AND IT IS THE PATCH THE WHOLE CELL BUDGET TURNS ON.
    # It was briefly given the 6-7 range Chassis still carries. That reads
    # like "flat panels stay at 0.75 mm, only curved regions reach 0.375 mm",
    # and on a tyre it would be - but Body is not a tyre. 93% of its area
    # already lands in the finest bin (see the wheel note below, same
    # measurement), so a 6-7 range on Body is level 7 almost everywhere, and
    # the mesh measured it:
    #
    #   Body at 6-7 -> 1,840,811 faces, 69% of every wall face in the case,
    #                  ~7.1M of the 9.5M cells layer addition adds, and a
    #                  20.26M total against a 15M target.
    #
    # Nothing else is close: Chassis is 447,456 faces, Wing 153,281, a tyre
    # ~23,000. Body is the only patch that can move five million cells, so it
    # is the one that pays for the target. At level 6 it also gets its full
    # 6-layer stack back: layer_budget_for() is 487.5 um at 0.75 mm against
    # 243.8 um at 0.375 mm, and the latter fits only 4 of the 6 requested
    # (see schema.n_layers_for). First-layer thickness is 40 um either way,
    # so y+ at the wall does not move - what changes is that the stack stops
    # handing off to the background two layers early.
    #
    # ---------------------------------------------------------------------
    # BODY IS NOW AT 7 (0.375 mm), 2026-08-22. THE PARAGRAPHS ABOVE ARE NOT
    # WRONG - THEIR PREMISE EXPIRED. Every measurement in them still holds;
    # what changed is the two things they were arguing from.
    #
    #   1. The budget. They were sizing to 15M, where Body's +9.46M does not
    #      fit. The target is now 20M.
    #   2. The priority. Body and Wing are the surfaces under development;
    #      Chassis, the tyres and the suspension are aero dummies that do not
    #      represent the real car. Spending the finest cells in the case on
    #      geometry nobody is going to iterate is backwards, however cheap
    #      those patches are per face.
    #
    # The cost is measured exactly, not estimated - car-15m-check against
    # car-15m-b differ in Body's refinement_max and essentially nothing else
    # (the mid-field reach moved 1.3 -> 1.8, worth 0.4%):
    #
    #   Body refinement_max 7 -> 20,259,975 cells
    #   Body refinement_max 6 -> 10,801,197 cells
    #                            +9,458,778 for this one line
    #
    # THE LAYER OBJECTION IS ANSWERED BY THE 25 um FIRST LAYER, not ignored.
    # At 40 um the 0.375 mm cell fit only 4 of 6 layers, which is what the
    # paragraph above objects to. At 25 um it fits 5, at 205 um of a 243.8 um
    # budget. Body still gives up one layer and drops from 58% to 84% budget
    # used, so expect its y+ to rise from ~0.9 toward ~1.3 - well inside the
    # 0-5 band, and the cost of resolving the surface that is actually being
    # designed.
    - {name: Body, role: body, refinement_min: 7, refinement_max: 7}
    # CHASSIS DROPS ITS RANGE AND GOES FLAT AT 0.75 mm, 2026-08-22. It kept a
    # 6-7 range on the argument below, which was about geometry: a mix of flat
    # plate and small curved detail is the case a range is for. That is still
    # true and no longer decisive - Chassis is an aero dummy. Its 446k faces
    # were the second-largest level-7 consumer in the case after the wing, and
    # that is resolution spent on a shape that does not represent the car.
    #
    # It stays at 0.75 mm rather than going coarser because it still blocks
    # and turns flow that reaches the Body and Wing downstream: the dummy's
    # exact shape does not matter, but the wake it sheds onto the surfaces
    # under development does.
    #
    #   (was) Chassis keeps the range. At 447k faces its level-7 share costs
    #   roughly a quarter of what Body's did, and unlike the bodywork shell it
    #   is a mix of flat plate and small curved detail, which is the case a
    #   6-7 range is actually for.
    - {name: Chassis, role: body, refinement_min: 6, refinement_max: 6}
    # A 42 mm chord on a 440 mm car: at the case-wide level the section stops
    # being an aerofoil. Pinned to level 7 (was 6), 2026-08-21, for the same
    # reason as Body/Chassis above and the same layer-budget cost - the whole
    # wing is a curved aerofoil section, not a mix of flat and curved like
    # the body, so it gets the fine level everywhere rather than a range.
    #
    # LEVELS ARE COUNTED FROM A 48 mm BACKGROUND. Level 6 is 0.75 mm. They
    # were one higher when the background was 96 mm; the 2026-08-21
    # re-basing (see profiles.py "car") moved every level by -1 and changed
    # no absolute size. tests/test_cell_sizes.py pins the metres, so if you
    # re-base again and miss a patch the suite fails.
    - {name: Wing, role: body, refinement_min: 7, refinement_max: 7}

    # --- wheels --------------------------------------------------------
    # PINNED TO ONE LEVEL, 7, RATHER THAN THE 6-7 RANGE THIS USED TO CARRY.
    # A range lets snappy hold flat regions at the minimum and spend level 7
    # only where curvature asks for it, and on a tyre most of the tread is
    # flat: only 39-50% of tyre area came out in the finest cell bin, against
    # 93% on Body and 77% on the suspension. The coarse half is a 1.5 mm cell,
    # and the wall-adjacent cell height follows the local cell - 119-127 um
    # there against 46-51 um on the fine half. That is what put area-weighted
    # y+ at 5.0-5.3 on three of the four tyres, outside the 0-5 band that
    # low_y_plus exists to hold, and it is the y+ gate's own failure.
    #
    # The layer budget does not change: surface_cell_size_for() sizes the
    # stack against refinement_MAX, which was already at the fine level, so
    # the 6 layers at 450 um were always budgeted against a 0.75 mm cell.
    # What changed is that the whole tyre got that cell instead of half of it.
    #
    # (The paragraph above says "level 7" and the values below now say 7 again
    # for a different reason. When it was written the background was 96 mm and
    # level 7 meant 0.75 mm; the 2026-08-21 re-basing to 48 mm made that same
    # 0.75 mm level 6, which is what these lines carried until now. Read the
    # metres, never the level numbers - tests/test_cell_sizes.py pins the
    # metres for exactly this reason.)
    #
    # HELD AT 0.75 mm, AND THE TYRE y+ IS FIXED BY THE FIRST LAYER ALONE.
    # 2026-08-22.
    #
    # These were briefly taken to 0.375 mm to fix the y+ gate failure on the
    # 13.28M run (Tire_FL 5.07 against a 0-5 band, all four tyres 4.58-5.07).
    # That was the wrong lever, and the layer table shows why it is not the
    # surface cell at fault - it is the stack being squeezed:
    #
    #   patch     layers of target   thickness achieved   y+
    #   Wing         3.61 / 4              91.5%          1.35
    #   Body         4.54 / 6              84.3%          1.49
    #   Tire_FL      3.10 / 6              64.9%          5.07
    #
    # Where the stack fits, snappy honours the 40 um first layer and y+ lands
    # near 1. Where it does not fit, snappy thickens the first layer rather
    # than dropping whole layers, and y+ goes to 5. The tyres wanted 450 um of
    # stack in a 487.5 um budget - 92% of it - with nothing left over to
    # absorb the medial-axis trouble a curved tread near a contact patch
    # always causes.
    #
    # THE "COARSER TYRE IS THE BETTER-RESOLVED WALL" ARGUMENT THAT USED TO SIT
    # HERE WAS WRONG, AND THE 22.93M RUN FALSIFIED IT. It reasoned from budget
    # headroom: the budget follows refinement_max, so 0.375 mm halves it to
    # 243.8 um and the stack uses 84% of it, while 0.75 mm uses 58% - and it
    # concluded that the larger margin would make snappy honour the 25 um
    # first layer. Measured across the two ~20M runs, y+ instead tracks the
    # SURFACE CELL, and halving the cell roughly halves y+:
    #
    #   patch      at 0.375 mm    at 0.750 mm
    #   Body          0.64           1.34
    #   Chassis       0.79           1.21
    #   Wing          1.14           1.13      <- unchanged in both, control
    #   tyres      2.08-2.17      4.25-4.87
    #
    # Wing is the control: it was 0.375 mm in both runs and moved 1.14 -> 1.13,
    # so the rest is not run-to-run scatter. The mechanism the headroom
    # argument missed is that snappy's medial-axis extrusion is limited by how
    # many faces it has across a curved feature, not by the nominal budget: at
    # 0.75 mm the tyres achieve 57-64% of their target stack thickness, at
    # 0.375 mm they achieve 83-85%, and the squeezed stack is what thickens
    # the first layer. max_layer_cell_ratio is an upper bound that rarely
    # binds; geometry binds first.
    #
    # SO THE TYRES SIT AT 0.75 mm ON PRIORITY ALONE, AND IT COSTS THEM y+.
    # They are aero dummies, the 1.5M cells refining them belong to Body, and
    # 4.25-4.87 is inside the 0-5 band - but only just, and only because the
    # 25 um first layer bought the margin the earlier 40 um did not have. If a
    # future change pushes them back over 5, refine them rather than reaching
    # for the first-layer thickness again. They stay at 0.75 mm rather than
    # going coarser still because the wake they shed lands on the surfaces
    # under development.
    # Three surfaces per corner sharing one wheel id. The id pairs them;
    # nothing parses the names. Axis, centre and rolling radius are measured
    # from these surfaces for whichever driving state is selected.
    - {name: Tire_FL, role: tyre, wheel: FL, refinement_min: 6, refinement_max: 6}
    - {name: Tire_FR, role: tyre, wheel: FR, refinement_min: 6, refinement_max: 6}
    - {name: Tire_RL, role: tyre, wheel: RL, refinement_min: 6, refinement_max: 6}
    - {name: Tire_RR, role: tyre, wheel: RR, refinement_min: 6, refinement_max: 6}

    # Closed sleeves around the rims, which become cell zones rather than
    # walls so the rim and spokes pump air. Meshed but not rotated separately
    # in cornering - see handbook section 6.
    - {name: MRF_FL, role: mrfZone, wheel: FL, refinement_min: 4, refinement_max: 5}
    - {name: MRF_FR, role: mrfZone, wheel: FR, refinement_min: 4, refinement_max: 5}
    - {name: MRF_RL, role: mrfZone, wheel: RL, refinement_min: 4, refinement_max: 5}
    - {name: MRF_RR, role: mrfZone, wheel: RR, refinement_min: 4, refinement_max: 5}

    # --- suspension ----------------------------------------------------
    # Upright, upper and lower arms, tie rod and driveshaft as one part per
    # corner. Static walls: they carry a wheel id nowhere, because tagging
    # them would drive the whole assembly about the *wheel's* axis, which is
    # right only for the upright and wrong for everything bolted to the chassis.
    #
    # Extra refinement for the same reason the Ahmed stilts get it: these are
    # 5 mm sections, and at the case-wide level snappy cannot build a medial
    # axis it trusts and the layers collapse.
    - {name: SUS_FL, role: body, refinement_min: 6, refinement_max: 6}
    - {name: SUS_FR, role: body, refinement_min: 6, refinement_max: 6}
    - {name: SUS_RL, role: body, refinement_min: 6, refinement_max: 6}
    - {name: SUS_RR, role: body, refinement_min: 6, refinement_max: 6}

    # --- domain boundaries ---------------------------------------------
    # No symmetry patch: asymmetric geometry, so the model is full.
    - {name: ground, role: ground}
    - {name: inlet, role: inlet}
    - {name: outlet, role: outlet}
    - {name: farfield, role: farfield}
